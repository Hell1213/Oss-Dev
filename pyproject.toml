[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-dev"
version = "0.2.0"
description = "Open Source Contributor Operating System for discovering, understanding, and contributing to OSS projects."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "OSS-Dev Maintainers" }]
dependencies = [
    "click>=8.0.0",
    "ddgs>=9.0.0",
    "fastmcp>=0.9.0",
    "GitPython>=3.1.0",
    "openai>=1.0.0",
    "platformdirs>=3.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "tiktoken>=0.5.0",
    "tomli>=2.0.0",
    "typer>=0.12.0",
]

[project.scripts]
oss-dev = "main:main"
oss-dev-new = "oss_dev.cli.app:app"

[dependency-groups]
dev = [
    "coverage[toml]>=7.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0",
    "typer>=0.12.0",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
    "oss_dev*",
    "agent*",
    "cli*",
    "client*",
    "config*",
    "context*",
    "hooks*",
    "oss*",
    "prompts*",
    "safety*",
    "tools*",
    "ui*",
    "utils*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["oss_dev", "agent", "cli", "client", "config", "context", "hooks", "oss", "prompts", "safety", "tools", "ui", "utils"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".mypy_cache",
    ".oss-dev",
    ".pytest_cache",
    ".venv",
    "__pycache__",
    "dist",
    "build",
]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["src/oss_dev", "tools/base.py", "client/response.py", "utils"]
ignore_missing_imports = true
warn_unused_configs = true
explicit_package_bases = true
check_untyped_defs = false
