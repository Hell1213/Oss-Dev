name: Contributor Assistant

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  triage:
    if: |
      !github.event.issue.pull_request &&
      (contains(github.event.comment.body, 'assign me') || 
       contains(github.event.comment.body, 'take this') ||
       contains(github.event.comment.body, 'work on this') ||
       contains(github.event.comment.body, 'I would like to work'))
    runs-on: ubuntu-latest
    steps:
      - name: Auto-assign and Welcome
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const user = context.payload.comment.user.login;
            
            // 1. Check if the issue is open
            const issue = await github.rest.issues.get({
              owner,
              repo,
              issue_number,
            });
            
            if (issue.data.state !== 'open') {
              console.log('Issue is not open. Skipping.');
              return;
            }

            // 2. Check if already assigned
            if (issue.data.assignees.length > 0) {
              const assignedUser = issue.data.assignees[0].login;
              if (assignedUser === user) {
                console.log('User is already assigned.');
                return;
              }
              
              // If someone else is assigned, notify the user
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `Hi @${user}, this issue is already assigned to @${assignedUser}. Please look for other open issues! 😊`
              });
              return;
            }

            // 3. Check for returning contributor (merged PRs)
            const searchResponse = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} author:${user} is:pr is:merged`
            });
            const isReturning = searchResponse.data.total_count > 0;

            // 4. Assign
            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number,
              assignees: [user]
            });

            // 5. Construct Personalized Comment
            const welcomeMsg = isReturning 
              ? `Welcome back @${user}! Great to see you contributing again. 🌟` 
              : `Welcome to the project @${user}! We're excited to have your first contribution. 🚀`;
            
            const body = `${welcomeMsg}\n\nI've assigned this issue to you. Happy coding! If you have any questions, feel free to ask here.\n\n---\n**Note:** If you find this project helpful, please consider giving us a star! ⭐ [Give a Star](https://github.com/${owner}/${repo})`;
            
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: body
            });
